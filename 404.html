<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Page Not Found">
    <meta name="keywords" content="404, Error">
    <meta name="author" content="Dufewe">
    <title>404 - Page Not Found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="./assets/css/onlinewebfonts.css"/>
    <link rel="stylesheet" type="text/css" href="./assets/css/vno.css">
    <link rel="stylesheet" type="text/css" href="./assets/css/iconfont_work/iconfont_work.css">
    <link rel="stylesheet" type="text/css" href="./assets/css/iconfont_life/iconfont_life.css">
    <link rel="stylesheet" type="text/css" href="./assets/css/iconfont_tools/iconfont_tools.css">
    <link rel="apple-touch-icon" href="./homeicon.jpg">
    <link rel="icon" href="./favicon.ico">
    <style type="text/css">
        html, body { height: 100%; margin: 0; }
        body { background: center center no-repeat #666; background-size: cover; position: relative; }
        body::before { content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 1; }
        .error-container {
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #eee;
            text-align: center;
            padding: 20px;
        }
        .error-code {
            font-size: 8em;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 30px rgba(76, 175, 80, 0.5);
            margin: 0;
            line-height: 1;
        }
        .error-message {
            font-size: 1.5em;
            color: #ccc;
            margin: 20px 0 40px;
        }
        .error-description {
            font-size: 1em;
            color: #aaa;
            max-width: 500px;
            line-height: 1.8;
            margin-bottom: 40px;
        }
        .back-home-btn {
            display: inline-block;
            padding: 14px 40px;
            background: rgba(76, 175, 80, 0.3);
            color: #eee;
            text-decoration: none;
            border-radius: 30px;
            border: 1px solid #4CAF50;
            font-size: 1em;
            transition: all 0.3s ease;
        }
        .back-home-btn:hover {
            background: rgba(76, 175, 80, 0.5);
            color: #fff;
            transform: translateY(-2px);
        }
        @media (max-width: 768px) {
            .error-code { font-size: 5em; }
            .error-message { font-size: 1.2em; }
            .error-description { font-size: 0.9em; }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1 class="error-code">404</h1>
        <p class="error-message">Page Not Found</p>
        <p class="error-description">
            The page you are looking for seems to have drifted into space. 
            Don't worry, even the best explorers get lost sometimes.
        </p>
        <a href="https://dufewe.github.io/" class="back-home-btn">← Back to Home</a>
    </div>
    
    <script type="text/javascript">
        // 使用与主页相同的 getBingImages 函数
        function getBingImages(imgUrls) {
            var indexName = "bing-image-index";
            var index = sessionStorage.getItem(indexName);
            if (isNaN(index) || index == 7) index = 0;
            else index++;
            var imgUrl = imgUrls[index];
            var url = "https://www.bing.com" + imgUrl;
            document.body.style.background = "url('" + url + "') center center no-repeat #666";
            document.body.style.backgroundSize = "cover";
            sessionStorage.setItem(indexName, index);
        }
    </script>
    <script type="text/javascript" src="./assets/json/images.json?cb=getBingImages"></script>
    <script type="text/javascript" src="./assets/js/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="All posts on the blog of Dufewe Fangu, grouped by category, tag and year.">
    <meta name="author" content="Dufewe">
    <title>Archive - Dufewe Fangu</title>
    <link rel="stylesheet" href="../assets/css/vno.css">
    <link rel="stylesheet" href="../assets/css/fonts.css">
    <link rel="stylesheet" href="../assets/css/blog.css">
    <link rel="apple-touch-icon" href="../homeicon.jpg">
    <link rel="icon" href="../favicon.ico">
</head>
<body>
    <a class="brand" href="https://dufewe.github.io/" title="Dufewe Fangu">
        <img class="brand__avatar" src="../assets/img/portrait.jpg" alt="Dufewe Fangu">
        <span class="brand__name">Dufewe Fangu</span>
    </a>

    <main class="blog-main">
        <div class="page">
            <a class="back-link" href="./">← Blog</a>

            <header class="page-head">
                <p class="eyebrow">Index</p>
                <h1 class="page-title">Archive</h1>
                <p class="page-intro">Everything written so far. Filter by category, jump through a tag, or read down the years.</p>
            </header>

            <div class="toolbar">
                <div class="filters" id="archive-filters" aria-label="Filter posts by category"></div>
                <p class="filter-hint" id="archive-hint"></p>
            </div>

            <div class="archive-list" id="archive-list">
                <p class="empty-state">No posts yet.</p>
            </div>
            <noscript>
                <p class="empty-state">This page needs JavaScript to list posts.</p>
            </noscript>

            <section class="panel">
                <h2 class="panel-title">Tags</h2>
                <div class="tag-cloud" id="tag-cloud"></div>
            </section>

            <section class="panel">
                <h2 class="panel-title">By year</h2>
                <div class="timeline" id="timeline"></div>
            </section>
        </div>
    </main>

    <script src="../assets/js/main.js"></script>
    <script src="../assets/json/images.json?cb=getBingImages"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/logic.js"></script>
    <script src="assets/js/components.js"></script>
    <script src="assets/js/page-archive.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A post by Dufewe Fangu.">
    <meta name="author" content="Dufewe">
    <title>Post - Dufewe Fangu</title>
    <link rel="stylesheet" href="../assets/css/vno.css">
    <link rel="stylesheet" href="../assets/css/fonts.css">
    <link rel="stylesheet" href="../assets/css/blog.css">
    <link rel="apple-touch-icon" href="../homeicon.jpg">
    <link rel="icon" href="../favicon.ico">
</head>
<body>
    <a class="brand" href="https://dufewe.github.io/" title="Dufewe Fangu">
        <img class="brand__avatar" src="../assets/img/portrait.jpg" alt="Dufewe Fangu">
        <span class="brand__name">Dufewe Fangu</span>
    </a>

    <main class="blog-main">
        <div class="page">
            <div class="layout">
                <div class="column-main">
                    <div id="post-root">
                        <a class="back-link" href="./">← All posts</a>

                        <article class="post-view">
                            <header class="article-head">
                                <h1 class="article-title" id="post-title">Loading…</h1>
                                <div class="article-meta" id="post-meta"></div>
                            </header>

                            <div class="post-links" id="post-links"></div>

                            <div class="doc-shell" id="doc-shell">
                                <iframe class="doc-frame" id="doc-frame" title="Post"></iframe>
                                <div class="doc-missing" id="doc-missing" hidden>
                                    <p>This post has not been built yet.</p>
                                    <p>Run <code>bash blog/scripts/build-posts.sh</code> and reload.</p>
                                </div>
                                <button class="doc-close" id="doc-close" type="button" aria-label="Exit full screen">×</button>
                            </div>
                        </article>

                        <nav class="post-nav" id="post-nav" aria-label="Newer and older posts"></nav>

                        <noscript>
                            <p class="empty-state">This page needs JavaScript to show the post.</p>
                        </noscript>
                    </div>
                </div>

                <aside class="column-side">
                    <section class="widget">
                        <h2 class="widget-title">Calendar</h2>
                        <div id="calendar"></div>
                    </section>
                    <section class="widget">
                        <h2 class="widget-title">Site</h2>
                        <div class="stats" id="site-stats"></div>
                    </section>
                    <div class="widget widget--meta">
                        <p class="site-meta" id="site-meta"></p>
                    </div>
                </aside>
            </div>
        </div>
    </main>

    <script src="../assets/js/main.js"></script>
    <script src="../assets/json/images.json?cb=getBingImages"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/logic.js"></script>
    <script src="assets/js/page-post.js"></script>
    <script src="assets/js/sidebar.js"></script>
</body>
</html>
